name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Verificar arquivos p1..p5
        run: |
          chk() {
            f="p$1.txt"
            if [ ! -f "$f" ]; then echo "FALTA o arquivo $f no repositorio"; exit 1; fi
            a=$(tr -d ' \r\n\t' < "$f" | sha256sum | cut -d' ' -f1)
            if [ "$a" != "$2" ]; then echo "O arquivo $f esta incompleto ou diferente. Cole de novo o conteudo inteiro."; exit 1; fi
          }
          chk 1 63897ac44fc240f439323e009ddb712f3ef8e42aa583956aa57c09691dae55b5
          chk 2 047237b1b8acdfa2a84e0902318b17fb23f5622a0dfbd70d445641c6e442c6e6
          chk 3 ffc18d85e9407e89e7011b86de4d78692cf5254d039716ad5bea91b36d88375c
          chk 4 88600e982481921a4088e828d18b86bd9e91b046b581b50c59f484eb5e08f898
          chk 5 46d0e4acf254a95b8b8216c20cdc324de41a9f48fa1ff0e396c0136ed38a7fc1
          echo "Todos os arquivos conferem."

      - name: Criar projeto
        run: |
          mkdir proj
          cat p1.txt p2.txt p3.txt p4.txt | tr -d ' \r\n\t' | base64 -d | tar xJ -C proj
          tr -d ' \r\n\t' < p5.txt | base64 -d | tar xz -C proj/app/src/main
          sed -i 's/android:label="Digimon World"/android:icon="@mipmap\/ic_launcher" android:label="DigiWorld"/' proj/app/src/main/AndroidManifest.xml
          sed -i 's/DIGIMON WORLD/DIGIWORLD/' proj/app/src/main/java/com/gustavo/digimonport/MainActivity.kt
          cat > proj/app/src/main/java/com/gustavo/digimonport/AspectBox.kt <<'EOF_ASPECT'
          package com.gustavo.digimonport

          import android.content.Context
          import android.view.View
          import android.widget.FrameLayout

          /** Caixa que centraliza o vídeo do jogo numa área 4:3, sem esticar nem desalinhar. */
          class AspectBox(ctx: Context) : FrameLayout(ctx) {
              private val ratio = 4f / 3f
              private var cw = 0
              private var ch = 0

              override fun onMeasure(wSpec: Int, hSpec: Int) {
                  val w = MeasureSpec.getSize(wSpec)
                  val h = MeasureSpec.getSize(hSpec)
                  cw = w
                  ch = (w / ratio).toInt()
                  if (ch > h) {
                      ch = h
                      cw = (h * ratio).toInt()
                  }
                  setMeasuredDimension(w, h)
                  for (i in 0 until childCount) {
                      getChildAt(i).measure(
                          MeasureSpec.makeMeasureSpec(cw, MeasureSpec.EXACTLY),
                          MeasureSpec.makeMeasureSpec(ch, MeasureSpec.EXACTLY)
                      )
                  }
              }

              override fun onLayout(changed: Boolean, l: Int, t: Int, r: Int, b: Int) {
                  val w = r - l
                  val h = b - t
                  for (i in 0 until childCount) {
                      val c: View = getChildAt(i)
                      c.layout((w - cw) / 2, (h - ch) / 2, (w + cw) / 2, (h + ch) / 2)
                  }
              }
          }
          EOF_ASPECT
          sed -i 's|root.addView(view, FrameLayout.LayoutParams(-1, -1))|val box = AspectBox(this); box.addView(view); root.addView(box, FrameLayout.LayoutParams(-1, -1))|' proj/app/src/main/java/com/gustavo/digimonport/GameActivity.kt
          grep -q "AspectBox(this)" proj/app/src/main/java/com/gustavo/digimonport/GameActivity.kt
          python3 - <<'PYEOF'
          p = "proj/app/src/main/assets/wiki.html"
          s = open(p, encoding="utf8").read()
          box = ('<details open class="ct"><summary>Controles no mapa (exploração)</summary><ul>'
                 '<li><b>D-Pad:</b> move o personagem pelo cenário.</li>'
                 '<li><b>✕:</b> anda / interage / inicia treinamentos no ginásio.</li>'
                 '<li><b>○:</b> fala com personagens, examina objetos ou abre o inventário/ações rápidas.</li>'
                 '<li><b>□:</b> executa o golpe final (Finisher) durante a batalha ou interações específicas.</li>'
                 '<li><b>△:</b> abre o menu principal do jogo ou cancela/encerra o treinamento no ginásio.</li>'
                 '<li><b>Start:</b> pausa o jogo (permite ver opções como salvar, carregar ou deletar jogo).</li>'
                 '</ul></details>')
          css = 'details.ct{margin:6px 14px;padding:8px 12px;background:#16222d;border-radius:10px;font-size:13px}details.ct summary{color:#FFB300;font-weight:bold}details.ct li{margin:5px 0}'
          s = s.replace('<div class="f">', box + '<div class="f">', 1)
          s = s.replace('</style>', css + '</style>', 1)
          assert 'class="ct"' in s
          open(p, "w", encoding="utf8").write(s)
          PYEOF
          sed -i "s/versionCode = 1/versionCode = ${{ github.run_number }}/" proj/app/build.gradle.kts
          sed -i 's|implementation("androidx.activity:activity-ktx:1.9.0")|implementation("androidx.activity:activity-ktx:1.9.0")\n    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")|' proj/app/build.gradle.kts
          python3 - <<'PYEOF2'
          p = "proj/app/src/main/java/com/gustavo/digimonport/GameActivity.kt"
          s = open(p, encoding="utf8").read()

          def rep(old, new):
              global s
              assert old in s, "ancora nao encontrada: " + old
              s = s.replace(old, new, 1)

          STARTUP = r'''        uiHandler.postDelayed({
                      if (prefs.contains("res_core")) applyRes(prefs.getInt("res_core", 0), false)
                      if (prefs.contains("res_screen")) applyRes(2 + prefs.getInt("res_screen", 0), false)
                  }, 3000)
          '''

          BUTTONS = r'''        // Botões FPS e RES (topo, centro)
                  fpsText = TextView(this).apply {
                      layoutParams = FrameLayout.LayoutParams(-2, -2)
                      setTextColor(Color.GREEN)
                      textSize = 14f
                      setShadowLayer(4f, 0f, 0f, Color.BLACK)
                      visibility = View.GONE
                  }
                  place(root, fpsText!!, Gravity.TOP or Gravity.CENTER_HORIZONTAL, t = 48)
                  val bFps = pad(PadButton.SHOULDER, "FPS", 52, 30)
                  place(root, bFps, Gravity.TOP or Gravity.CENTER_HORIZONTAL, r = 130, t = 10)
                  control("fps", bFps, tapListener { toggleFps() })
                  val bRes = pad(PadButton.SHOULDER, "RES", 52, 30)
                  place(root, bRes, Gravity.TOP or Gravity.CENTER_HORIZONTAL, l = 130, t = 10)
                  control("res", bRes, tapListener { showResolution() })

          '''

          METHODS = r'''    // ---------- FPS e resolução ----------

              private var fpsText: TextView? = null
              private var showFps = false
              private var frameCount = 0
              private var fpsJob: kotlinx.coroutines.Job? = null
              private val uiScope = MainScope()
              private val uiHandler = android.os.Handler(android.os.Looper.getMainLooper())
              private val fpsTick = object : Runnable {
                  override fun run() {
                      if (!showFps) return
                      fpsText?.text = "FPS: $frameCount"
                      frameCount = 0
                      uiHandler.postDelayed(this, 1000)
                  }
              }

              private fun toggleFps() {
                  showFps = !showFps
                  fpsText?.visibility = if (showFps) View.VISIBLE else View.GONE
                  uiHandler.removeCallbacks(fpsTick)
                  fpsJob?.cancel()
                  if (!showFps) return
                  frameCount = 0
                  fpsText?.text = "FPS: ..."
                  fpsJob = uiScope.launch {
                      try {
                          val r = retro ?: return@launch
                          @Suppress("UNCHECKED_CAST")
                          val flow = r.javaClass.getMethod("getGLRetroEvents").invoke(r) as kotlinx.coroutines.flow.Flow<Any?>
                          flow.collect { frameCount += 1 }
                      } catch (t: Throwable) {
                          fpsText?.text = "FPS: indisponível"
                      }
                  }
                  uiHandler.postDelayed(fpsTick, 1000)
              }

              private fun setCoreVar(key: String, value: String): Boolean {
                  val r = retro ?: return false
                  return try {
                      val vc = Class.forName("com.swordfish.libretrodroid.Variable")
                      val v = vc.getConstructor(String::class.java, String::class.java).newInstance(key, value)
                      val arr = java.lang.reflect.Array.newInstance(vc, 1)
                      java.lang.reflect.Array.set(arr, 0, v)
                      r.javaClass.getMethod("updateVariables", arr.javaClass).invoke(r, arr)
                      true
                  } catch (t: Throwable) {
                      false
                  }
              }

              private fun applyRes(which: Int, save: Boolean) {
                  val v = retro ?: return
                  when (which) {
                      0, 1 -> {
                          setCoreVar("pcsx_rearmed_neon_enhancement_enable", if (which == 1) "enabled" else "disabled")
                          if (save) prefs.edit().putInt("res_core", which).apply()
                      }
                      2 -> {
                          v.holder.setSizeFromLayout()
                          if (save) prefs.edit().putInt("res_screen", 0).apply()
                      }
                      3 -> {
                          val w = (v.width * 0.6f).toInt()
                          val h = (v.height * 0.6f).toInt()
                          if (w > 0 && h > 0) v.holder.setFixedSize(w, h)
                          if (save) prefs.edit().putInt("res_screen", 1).apply()
                      }
                  }
              }

              private fun showResolution() {
                  val core = if (prefs.getInt("res_core", 0) == 1) "2x" else "1x"
                  val scr = if (prefs.getInt("res_screen", 0) == 1) "60%" else "100%"
                  val items = arrayOf(
                      "Interna 1x (original, mais leve)",
                      "Interna 2x (melhorada, mais pesada)",
                      "Tela nítida (100%)",
                      "Tela leve (60%, mais rápida)"
                  )
                  AlertDialog.Builder(this)
                      .setTitle("Resolução (interna: $core, tela: $scr)")
                      .setItems(items) { _, which ->
                          applyRes(which, true)
                          android.widget.Toast.makeText(this, items[which], android.widget.Toast.LENGTH_SHORT).show()
                      }
                      .show()
              }

              override fun onDestroy() {
                  uiHandler.removeCallbacksAndMessages(null)
                  fpsJob?.cancel()
                  super.onDestroy()
              }

          '''

          rep("import java.io.File\n", "import java.io.File\nimport kotlinx.coroutines.MainScope\nimport kotlinx.coroutines.launch\n")
          rep("        lifecycle.addObserver(view)\n", "        lifecycle.addObserver(view)\n" + STARTUP)
          rep("        // Menu (ícone de pausa, canto superior direito): editar controles e acelerar\n",
              BUTTONS + "        // Menu (ícone de pausa, canto superior direito): editar controles e acelerar\n")
          rep("    private fun showMenu() {", METHODS + "    private fun showMenu() {")
          open(p, "w", encoding="utf8").write(s)
          PYEOF2
          grep -q toggleFps proj/app/src/main/java/com/gustavo/digimonport/GameActivity.kt
          mkdir -p proj/app/src/main/jniLibs/arm64-v8a
          curl -L -o core.zip https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/pcsx_rearmed_libretro_android.so.zip
          unzip -o core.zip -d proj/app/src/main/jniLibs/arm64-v8a/
          cd proj/app/src/main/jniLibs/arm64-v8a
          if [ -f pcsx_rearmed_libretro_android.so ]; then mv pcsx_rearmed_libretro_android.so libpcsx_rearmed_libretro_android.so; fi
          test -f libpcsx_rearmed_libretro_android.so || { echo "Nucleo nao encontrado"; ls -la; exit 1; }
          ls -la
          cd "$GITHUB_WORKSPACE"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Compilar release
        working-directory: proj
        run: gradle assembleRelease --no-daemon

      - name: Publicar Release no GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp proj/app/build/outputs/apk/release/app-release.apk DigimonWorld.apk
          gh release create "v1.${{ github.run_number }}" DigimonWorld.apk --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Digimon World v1.${{ github.run_number }}" --notes "APK release assinado"
