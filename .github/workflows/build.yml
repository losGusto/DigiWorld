name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Criar projeto
        run: |
          mkdir proj
          echo "$PROJ_B64" | base64 -d | tar xz -C proj
          sed -i "s/versionCode = 1/versionCode = ${{ github.run_number }}/" proj/app/build.gradle.kts
          mkdir -p proj/app/src/main/jniLibs/arm64-v8a
          curl -L -o core.zip https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/pcsx_rearmed_libretro_android.so.zip
          unzip -o core.zip -d proj/app/src/main/jniLibs/arm64-v8a/
          ls -la proj/app/src/main/jniLibs/arm64-v8a/

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Compilar release
        working-directory: proj
        run: gradle assembleRelease --no-daemon

      - name: Publicar Release no GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp proj/app/build/outputs/apk/release/app-release.apk DigimonWorld.apk
          gh release create "v1.${{ github.run_number }}" DigimonWorld.apk --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Digimon World v1.${{ github.run_number }}" --notes "APK release assinado"

env:
  PROJ_B64: 
